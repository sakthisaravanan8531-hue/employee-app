name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOYMENT_ROLE_ARN != ''
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: production
    concurrency:
      group: employee-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      RELEASE_PARAMETER: /employee-app/backend-release
      ASG_NAME: ${{ vars.ASG_NAME }}
      API_URL: ${{ vars.API_URL }}
      APP_URL: ${{ vars.APP_URL }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEPLOYMENT_ROLE_ARN }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w frontend
      - name: Release backend and Amplify frontend
        run: python3 deployment/scripts/release.py
